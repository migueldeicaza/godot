name: 🍏 iOS Builds
on:
  workflow_call:
  workflow_dispatch:

# Global Settings
env:
  SCONS_FLAGS: >-
    dev_mode=yes
    module_text_server_fb_enabled=yes
    tests=no
    debug_symbols=no
    library_type=static_library
    vulkan=no
    metal=yes
    disable_path_overrides=no

jobs:
  ios-libgodot:
    # From https://docs.github.com/en/actions/how-tos/write-workflows/choose-where-workflows-run/choose-the-runner-for-a-job#choosing-github-hosted-runners
    runs-on: macos-latest
    name: libgodot iOS (template_release)
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # From https://github.com/actions/runner-images/blob/main/images/macos
      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.0.1.app

      - name: Restore Godot build cache
        uses: ./.github/actions/godot-cache-restore
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Compilation (arm64 device)
        uses: ./.github/actions/godot-build
        with:
          scons-flags: ${{ env.SCONS_FLAGS }} arch=arm64 simulator=no
          platform: ios
          target: template_release

      - name: Compilation (arm64 simulator)
        uses: ./.github/actions/godot-build
        with:
          scons-flags: ${{ env.SCONS_FLAGS }} arch=arm64 simulator=yes
          platform: ios
          target: template_release

      - name: Compilation (x86_64 simulator)
        uses: ./.github/actions/godot-build
        with:
          scons-flags: ${{ env.SCONS_FLAGS }} arch=x86_64 simulator=yes
          platform: ios
          target: template_release

      - name: Verify embeddable archives
        run: |
          set -euo pipefail

          for archive in \
            bin/libgodot.ios.template_release.arm64.a \
            bin/libgodot.ios.template_release.arm64.simulator.a \
            bin/libgodot.ios.template_release.x86_64.simulator.a
          do
            if ! nm -gjU "$archive" 2>/dev/null > symbols.txt; then
              echo "Could not inspect symbols in: $archive" >&2
              exit 1
            fi
            if grep -qx _main symbols.txt; then
              echo "The embeddable archive exports _main: $archive" >&2
              exit 1
            fi
            for symbol in \
              _libgodot_create_godot_instance \
              _libgodot_destroy_godot_instance \
              _libgodot_ios_create_rendering_layer \
              _libgodot_ios_initialize_rendering_layer \
              _libgodot_ios_layout_rendering_layer \
              _libgodot_ios_start_rendering_layer \
              _libgodot_ios_stop_rendering_layer
            do
              if ! grep -qx "$symbol" symbols.txt; then
                echo "The embeddable archive is missing $symbol: $archive" >&2
                exit 1
              fi
            done
            if ! ar -t "$archive" > archive_members.txt; then
              echo "Could not inspect members in: $archive" >&2
              exit 1
            fi
            if grep -Eq '(^|/)app\..*\.o$' archive_members.txt; then
              echo "The embeddable archive contains the standalone app object: $archive" >&2
              exit 1
            fi
          done

      - name: Save Godot build cache
        uses: ./.github/actions/godot-cache-save
        continue-on-error: true

      - name: Upload artifact
        uses: ./.github/actions/upload-artifact
        with:
          name: libgodot-ios
          path: |
            bin/libgodot.ios.template_release.arm64.a
            bin/libgodot.ios.template_release.arm64.simulator.a
            bin/libgodot.ios.template_release.x86_64.simulator.a
            core/extension/libgodot.h
            core/extension/gdextension_interface.gen.h
