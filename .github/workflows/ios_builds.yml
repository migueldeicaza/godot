name: 🍏 iOS Builds
on:
  workflow_call:
  workflow_dispatch:

# Global Settings
env:
  SCONS_FLAGS: >-
    dev_mode=yes
    module_text_server_fb_enabled=yes
    tests=no
    debug_symbols=no
    vulkan=no
    metal=yes
    disable_path_overrides=no

jobs:
  ios-libgodot:
    # From https://docs.github.com/en/actions/how-tos/write-workflows/choose-where-workflows-run/choose-the-runner-for-a-job#choosing-github-hosted-runners
    runs-on: macos-latest
    name: libgodot iOS (template_release)
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # From https://github.com/actions/runner-images/blob/main/images/macos
      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.0.1.app

      - name: Restore Godot build cache
        uses: ./.github/actions/godot-cache-restore
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Compilation (arm64 device)
        uses: ./.github/actions/godot-build
        with:
          scons-flags: ${{ env.SCONS_FLAGS }} arch=arm64 simulator=no
          platform: ios
          target: template_release

      - name: Compilation (arm64 simulator)
        uses: ./.github/actions/godot-build
        with:
          scons-flags: ${{ env.SCONS_FLAGS }} arch=arm64 simulator=yes
          platform: ios
          target: template_release

      - name: Compilation (x86_64 simulator)
        uses: ./.github/actions/godot-build
        with:
          scons-flags: ${{ env.SCONS_FLAGS }} arch=x86_64 simulator=yes
          platform: ios
          target: template_release

      - name: Verify libgodot iOS bridge symbols
        run: |
          set -euo pipefail
          libs=(
            "bin/libgodot.ios.template_release.arm64.a"
            "bin/libgodot.ios.template_release.arm64.simulator.a"
            "bin/libgodot.ios.template_release.x86_64.simulator.a"
          )
          for lib in "${libs[@]}"; do
            echo "Checking symbols in $lib"
            nm -gU "$lib" | grep -q "_libgodot_create_godot_instance"
            nm -gU "$lib" | grep -q "_libgodot_destroy_godot_instance"
          done

      - name: Save Godot build cache
        uses: ./.github/actions/godot-cache-save
        continue-on-error: true

      - name: Upload artifact
        uses: ./.github/actions/upload-artifact
        with:
          name: libgodot-ios
          path: |
            bin/libgodot.ios.template_release.arm64.a
            bin/libgodot.ios.template_release.arm64.simulator.a
            bin/libgodot.ios.template_release.x86_64.simulator.a
            core/extension/libgodot.h
            core/extension/gdextension_interface.gen.h
